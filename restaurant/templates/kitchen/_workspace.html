<div class="kitchen-workspace" data-kitchen>

  <div class="kitchen-content">
    <div class="kitchen-heading">
      <h1 tabindex="-1">Kitchen</h1>
      <button type="button" class="kitchen-action" data-kitchen-refresh>Refresh</button>
    </div>
    <p role="status" data-kitchen-feedback></p>

    <section id="kitchen-queue" aria-labelledby="kitchen-queue-title">
      <div class="kitchen-section-heading">
        <h2 id="kitchen-queue-title" tabindex="-1">Preparation queue</h2>
        <p data-kitchen-count role="status" tabindex="-1"></p>
      </div>
      <div class="kitchen-ticket-grid" data-kitchen-tickets></div>
    </section>

    <section id="kitchen-availability" aria-labelledby="kitchen-availability-title" hidden>
      <div class="kitchen-section-heading">
        <h2 id="kitchen-availability-title" tabindex="-1">Menu availability</h2>
        <p data-availability-count role="status"></p>
      </div>
      <div class="kitchen-menu-grid">
        {% for category, label in categories.items() %}
        <section class="kitchen-menu-group" aria-labelledby="kitchen-category-{{ category }}">
          <h3 id="kitchen-category-{{ category }}">{{ label }}</h3>
          <ul class="kitchen-item-list" data-kitchen-category="{{ category }}"></ul>
        </section>
        {% endfor %}
        {% if 'other' not in categories %}
        <section class="kitchen-menu-group" hidden>
          <h3>Other</h3><ul class="kitchen-item-list" data-kitchen-category="other"></ul>
        </section>
        {% endif %}
      </div>
    </section>
  </div>
</div>
