{% macro floor_map(tables, staff=false, preview=false, show_capacity=false) -%}
<div class="floor{{ ' desk-floor' if staff }}" role="group" aria-label="Table map">
  <span class="wall-label">Window seats</span><span class="bar-label">Service bar</span><span class="entry-label">Entrance</span>
  {% for id, seats, x, y in tables %}
  {% if preview %}
  <span class="seat seat-preview {{ 'small' if seats == 2 else 'long' if seats == 6 }}"
        aria-label="Table {{ id }}, {{ seats }} seats" style="left:{{ x }}%;top:{{ y }}%">{{ id }}{% if show_capacity %}<small aria-hidden="true">{{ seats }} seats</small>{% endif %}</span>
  {% else %}
  <button type="button" class="seat {{ 'small' if seats == 2 else 'long' if seats == 6 }}"
          {% if staff %}data-desk-table="{{ id }}"{% else %}data-action="seat:{{ id }}"{% endif %}
          aria-label="Table {{ id }}, {{ seats }} seats" aria-pressed="false"
          style="left:{{ x }}%;top:{{ y }}%">{{ id }}{% if show_capacity %}<small aria-hidden="true">{{ seats }} seats</small>{% endif %}</button>
  {% endif %}
  {% endfor %}
</div>
{%- endmacro %}
