{% from 'customer/_guest_parts.html' import sign_out %}
<div id="dp-workspace" data-admin
     data-asset-root="{{ url_for('static', filename='images/admin/') }}"
     data-workspace-url="{{ url_for('admin.workspace_data') }}"
     data-order-url="{{ url_for('admin.workspace_orders') }}"
     data-accounts-url="{{ url_for('admin.staff_accounts') }}"
     data-staff-url="{{ url_for('admin.create_staff') }}"
     data-dishes-url="{{ url_for('admin.menu') }}">
  <header class="dp-top">
    <div class="dp-brand">
      <button class="dp-brand-mark" type="button" data-action="navigation" aria-label="Open navigation" aria-haspopup="dialog" aria-controls="nav">
        <img width="28" height="28" alt="" src="{{ url_for('static', filename='images/admin/double-portion-mark.png') }}">
      </button>
      <div class="dp-brand-title">
        <button class="dp-wordmark" type="button" data-view="overview">Double Portion</button>
        <span class="dp-brand-subtitle">Dashboard</span>
      </div>
    </div>
    <div class="dp-shift">
      <time data-service-clock></time>
      <div class="dp-user">
        <button class="dp-user-button" type="button" aria-label="Administrator profile" aria-expanded="false" aria-controls="dp-user-profile">A</button>
        <div class="dp-user-profile" id="dp-user-profile" hidden>
          <strong>{{ account.name or 'Administrator' }}</strong>
          <p class="dp-caption">Administrator</p>
          {{ sign_out(logout_form) }}
        </div>
      </div>
    </div>
  </header>
  <div class="dp-shell">
    <aside class="dp-sidebar">
      <nav aria-label="Workspace">
        <div class="dp-nav-group">
          <h2 class="dp-nav-heading">Operations</h2>
          <button type="button" data-view="overview" aria-current="page">Overview</button>
          <button type="button" data-view="orders">Orders</button>
          <button type="button" data-view="queue">Kitchen queue</button>
          <button type="button" data-view="floor">Tables</button>
        </div>
        <div class="dp-nav-group">
          <h2 class="dp-nav-heading">Management</h2>
          <button type="button" data-view="accounts">Accounts</button>
          <button type="button" data-view="dishes">Dishes</button>
          <button type="button" data-view="inventory">Inventory</button>
        </div>
      </nav>
    </aside>
    <div class="dp-main">
      <p class="dp-workspace-feedback dp-caption" data-admin-feedback role="status" hidden></p>
      <div class="dp-workspace-view" id="dp-main" data-workspace-view></div>
    </div>
  </div>
  <dialog class="dp-confirmation" aria-labelledby="dp-confirmation-title">
    <div class="dp-burger" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h2 id="dp-confirmation-title">Dish saved</h2>
    <p data-saved-dish></p>
    <button type="button" class="dp-button dp-primary" data-close-dialog>Back to dishes</button>
  </dialog>
  <dialog class="dp-confirmation dp-deactivation" aria-labelledby="dp-deactivation-title">
    <h2 id="dp-deactivation-title">Deactivate staff account?</h2>
    <p data-deactivation-name></p>
    <p data-action-feedback role="alert" hidden></p>
    <div class="dp-heading-tools">
      <button type="button" class="dp-button" data-close-dialog>Cancel</button>
      <button type="button" class="dp-button dp-danger" data-confirm-deactivate>Deactivate</button>
    </div>
  </dialog>
</div>
