<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0b">
  <title>{{ title }} · Double Portion</title>
  <style>
    :root { color-scheme: dark; }
    body {
      box-sizing: border-box;
      display: grid;
      align-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(1.5rem, 6vw, 5rem);
      background: #0c0c0b;
      color: #efe7d2;
      font: 1rem/1.6 "Segoe UI", system-ui, sans-serif;
    }
    main { width: min(100%, 37rem); margin-inline: auto; }
    .brand { color: #cfbc96; font: 1.35rem/1.3 "Palatino Linotype", Palatino, Georgia, serif; }
    h1 {
      margin: .65rem 0 1rem;
      font: 400 clamp(2.5rem, 7vw, 4.2rem)/1.08 "Palatino Linotype", Palatino, Georgia, serif;
    }
    p { max-width: 34rem; margin: 0 0 1.5rem; }
    .status { margin: 0; color: #b4a891; font-variant-numeric: tabular-nums; }
    .action {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding-inline: 1rem;
      border-radius: .25rem;
      background: #efe7d2;
      color: #151410;
      font-weight: 600;
      text-decoration: none;
    }
    .action:hover { background: #fff6e2; }
    .action:focus-visible { outline: 2px solid #cfbc96; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Double Portion</p>
    <p class="status">{{ status }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if status == 401 %}
      <a class="action" href="{{ url_for('auth.login') }}">Sign in</a>
    {% else %}
      <a class="action" href="{{ url_for('home') }}">Back to the restaurant</a>
    {% endif %}
  </main>
</body>
</html>
