name: Pull request tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: usurpers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d usurpers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      USURPERS_TEST_POSTGRES_URL: postgresql://postgres:ci-only@127.0.0.1:5432/usurpers_test
      USURPERS_HTTPS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
